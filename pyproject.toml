[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "space-universe-documentary-pipeline"
version = "0.1.0"
description = "Provider-agnostic automation engine for space documentaries and Shorts"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
space-doc = "pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
